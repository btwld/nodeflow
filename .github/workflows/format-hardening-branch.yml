name: Format hardening branch

on:
  push:
    branches:
      - refactor/nodeflow-flutter-hardening-20260928

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/nodeflow-flutter-hardening-20260928
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart format lib test example/lib
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test example/lib analysis_options.yaml example/analysis_options.yaml
          git commit -m "style: apply dart format"
          git push
