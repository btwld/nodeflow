name: node_flow
description: >-
  React Flow-style node editor canvas for Flutter: pan/zoom viewport, draggable
  nodes, drag-to-connect edges, marquee selection, snap guides, and a minimap.
version: 0.2.2
repository: https://github.com/btwld/nodeflow
issue_tracker: https://github.com/btwld/nodeflow/issues
topics:
  - node-editor
  - flow
  - canvas
  - graph
  - diagram

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  bitwild_analysis:
    git:
      url: https://github.com/btwld/lints.git
      path: packages/bitwild_analysis
      ref: v0.3.0
  flutter_test:
    sdk: flutter
